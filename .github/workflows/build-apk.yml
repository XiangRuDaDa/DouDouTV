name: Build APK

on:
  push:
    branches: [ main, master, dev ]
    # 正式发版：git tag -a v1.0.0 && git push origin v1.0.0 → 出不可覆盖的正式包
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_NAME: DouDouTV

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          set -e
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ ! -d "$SDK_ROOT" ]; then
            echo "错误：预装 Android SDK 未找到于 $SDK_ROOT" >&2
            exit 1
          fi
          echo "SDK root = $SDK_ROOT"
          echo "sdk.dir=$SDK_ROOT" > local.properties
          cat local.properties
          echo "--- platforms ---"
          ls "$SDK_ROOT/platforms"
          echo "--- build-tools ---"
          ls "$SDK_ROOT/build-tools"

      # 出正式包（release）：和 debug 同一颗 keystore、同一包名，覆盖安装不丢数据
      - name: Build release APK
        run: |
          chmod +x ./gradlew
          ok=0
          for i in 1 2; do
            if ./gradlew assembleRelease --stacktrace --no-daemon > "/tmp/build-$i.log" 2>&1; then
              ok=1
              tail -n 5 "/tmp/build-$i.log"
              break
            fi
            echo "::warning::构建失败（第 $i 次），15 秒后重试..."
            sleep 15
          done
          if [ "$ok" != "1" ]; then
            # Actions 的日志正文要仓库管理员权限才能下载，annotation 是公开可读的。
            # 失败时把根因原样吐成 annotation，不登录仓库也能看出挂在哪一步。
            log=$(ls -1 /tmp/build-*.log | tail -1)
            SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
            # 多条日志并成一条 annotation：% 先转义，换行换成 %0A，命令才不会被打断
            ann() {
              awk -v tag="$1" '
                { gsub(/%/, "%25"); msg = msg (NR > 1 ? "%0A" : "") substr($0, 1, 170) }
                END { if (length(msg)) msg = "%0A" msg; printf "::error::%s%s\n", tag, msg }
              ' "$2"
            }
            head -n 2 "$log" > /tmp/d1                              # 第一行就能看出 Gradle 包是从哪取的
            grep -E '^e: |error: |Caused by: |Could not ' "$log" | head -n 8 > /tmp/d2 || true
            grep -A 8 'What went wrong' "$log" | head -n 10 > /tmp/d3 || true
            tail -n 8 "$log" > /tmp/d4
            {
              echo "platforms: $(ls "$SDK_ROOT/platforms" 2>&1 | tr '\n' ' ')"
              echo "build-tools: $(ls "$SDK_ROOT/build-tools" 2>&1 | tr '\n' ' ')"
              echo "mem(MB): $(free -m | awk 'NR==2 { print $3 "/" $2 }')"
              echo "disk: $(df -h "$PWD" | awk 'NR==2 { print $4 " free of " $2 }')"
            } > /tmp/d5
            ann "DIAG-1-取包" /tmp/d1
            ann "DIAG-2-报错行" /tmp/d2
            ann "DIAG-3-WentWrong" /tmp/d3
            ann "DIAG-4-末尾" /tmp/d4
            ann "DIAG-5-环境" /tmp/d5
            echo "::error::重试后构建仍然失败"
            exit 1
          fi

      - name: List output
        run: ls -lh app/build/outputs/apk/release/

      # 不做任何压缩，直接拿到 .apk 原始文件
      - name: Prepare raw APK
        run: |
          set -e
          mkdir -p dist
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # 正式发版：tag 名本身就带 v + 版本号，不再叠加 versionName，免得文件名出现两个版本
            APK_NAME="${APP_NAME}-${GITHUB_REF_NAME}.apk"
          else
            VERSION=$(grep -m1 'versionName' app/build.gradle.kts | sed 's/.*versionName *= *"\(.*\)".*/\1/')
            APK_NAME="${APP_NAME}-v${VERSION}-${GITHUB_REF_NAME}.apk"
          fi
          cp app/build/outputs/apk/release/app-release.apk "dist/${APK_NAME}"
          ls -lh "dist/${APK_NAME}"
          echo "APK_NAME=${APK_NAME}" >> "$GITHUB_ENV"

      # 通过 GitHub Release 发布原始 APK：下载链接点开就是 .apk，不是 zip
      - name: Publish raw APK to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # 正式包：挂在发版 tag 上，同名 tag 已有 Release 就直接失败，不覆盖 —— 别人手上的链接必须一直指向同一个包
            gh release create "$GITHUB_REF_NAME" "dist/${APK_NAME}" \
              --target "$GITHUB_SHA" \
              --title "${APP_NAME} ${GITHUB_REF_NAME}" \
              --notes-file CHANGELOG.md
            LINK_TAG="$GITHUB_REF_NAME"
          else
            # 分支包：滚动覆盖 <分支>-latest，只用来随时拿最新可装的包
            TAG="${GITHUB_REF_NAME}-latest"
            PRERELEASE=""
            if [ "${GITHUB_REF_NAME}" != "main" ] && [ "${GITHUB_REF_NAME}" != "master" ]; then
              PRERELEASE="--prerelease"
            fi
            gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
            gh release create "$TAG" "dist/${APK_NAME}" \
              --target "$GITHUB_SHA" \
              --title "${APP_NAME} ${GITHUB_REF_NAME} 最新构建" \
              --notes "自动构建：${GITHUB_REF_NAME} @ ${GITHUB_SHA:0:7}，点击下方 ${APK_NAME} 直接下载安装，无需解压。" \
              $PRERELEASE
            LINK_TAG="$TAG"
          fi
          echo "### 直接下载 APK（无压缩、无 zip）" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/${LINK_TAG}/${APK_NAME}" >> "$GITHUB_STEP_SUMMARY"
